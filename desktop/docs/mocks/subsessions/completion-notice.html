<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Aviso de subagente terminado</title>
<!--
  MOCK — not product code. completion-notice.html#dark / #light.
  Today the wake-up input Workass sends when a subagent finishes is drawn as a
  user bubble ("Internal agent completion notice…"). Proposal: draw it as one
  quiet system line (like Claude Code's task notifications), result folded.
  Base tokens and .userpill/.p/.evt from subsessions.html / app.css.
-->
<style>
.th-dark { color-scheme: dark; --bg:#0f0e0d; --panel:#1d1c1a; --field:#252320; --ink:#f2efe9; --ink2:#cfcbc4; --muted:#9c978f; --faint:#908b82; --line:rgba(255,255,255,.075); --line2:rgba(255,255,255,.14); --shell:#0b0a09; --acc:#4fa583; }
.th-light { color-scheme: light; --bg:#f2f0ed; --panel:#fff; --field:#f1efeb; --ink:#23211e; --ink2:#47443e; --muted:#5f5b55; --faint:#6d685f; --line:rgba(0,0,0,.08); --line2:rgba(0,0,0,.15); --shell:#eceae6; --acc:#177353; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: #0b0a09; }
body { font: 13.5px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
:root { --mono: ui-monospace, "SF Mono", Menlo, monospace; }
body.only-dark .th-light, body.only-light .th-dark { display: none; }
svg.g { display: block; fill: none; stroke: currentColor; stroke-width: 1.35; stroke-linecap: round; stroke-linejoin: round; }
.sheet { background: var(--shell); color: var(--ink); padding: 28px 32px 34px; width: 1180px; }
h1 { font-size: 19px; font-weight: 600; margin-bottom: 4px; }
.lede { color: var(--muted); font-size: 12.5px; max-width: 1000px; margin-bottom: 18px; }
.lede b { color: var(--ink2); font-weight: 550; }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.cap { font: 600 10px/1 var(--mono); letter-spacing: .13em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px 2px; }
.cap b { color: var(--ink2); }
.win { background: var(--bg); border: 1px solid var(--line2); border-radius: 12px; padding: 22px 26px; min-height: 430px; }
.userpill { display: flex; justify-content: flex-end; margin: 4px 0 16px; }
.userpill-text { background: var(--field); border: 1px solid var(--line); border-radius: 14px; padding: 7px 13px; max-width: 86%; font-size: 13px; color: var(--ink); white-space: pre-wrap; }
.p { margin: 0 0 14px; color: var(--ink); }
.p b { font-weight: 600; }
/* NEW: the quiet notice line */
.note { display: flex; align-items: center; gap: 8px; margin: 6px 0 12px; font-size: 12px; color: var(--muted); min-width: 0; }
.note .ic { flex: none; display: inline-flex; width: 14px; height: 14px; color: var(--faint); }
.note .ic svg { width: 14px; height: 14px; }
.note .nm { color: var(--ink2); text-decoration: underline dotted color-mix(in srgb, var(--faint) 65%, transparent); text-underline-offset: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.note .st { white-space: nowrap; }
.note .cv { display: inline-flex; color: var(--faint); transform: rotate(90deg); } .note .cv svg { width: 11px; height: 11px; }
.note.open .cv { transform: rotate(270deg); }
.res { margin: -4px 0 14px 22px; padding: 8px 12px; border-left: 1px solid var(--line2); font-size: 12.5px; color: var(--ink2); }
</style>
</head>
<body>
<div id="out"></div>
<script>
const G = (d) => `<svg class="g" viewBox="0 0 16 16">${d}</svg>`;
const AGENT = G('<circle cx="8" cy="5.2" r="2.4"/><path d="M3 13.2a5 5 0 0110 0"/>');
const CHEV = G('<path d="M6 4l4 4-4 4"/>');
const notice = `Internal agent completion notice. A tracked subagent finished; this notice was generated by Workass and is not a human message.
Receipt: wa-subagent-1792180749204-1
Agent: Revisión del diff
Outcome: done
Result:
Dos defectos reales en el corte del fork…`;
const today = () => `
  <div class="userpill"><div class="userpill-text">Lanzá un subagente que revise el diff y seguí con lo tuyo.</div></div>
  <p class="p">Listo, lo lancé en segundo plano; te aviso cuando termine.</p>
  <div class="userpill"><div class="userpill-text">${notice}</div></div>
  <p class="p">El subagente terminó: encontró <b>dos defectos</b> en el corte del fork. Los corrijo ahora.</p>`;
const proposal = (open) => `
  <div class="userpill"><div class="userpill-text">Lanzá un subagente que revise el diff y seguí con lo tuyo.</div></div>
  <p class="p">Listo, lo lancé en segundo plano; te aviso cuando termine.</p>
  <div class="note ${open ? 'open' : ''}"><span class="ic">${AGENT}</span><span class="nm">Revisión del diff</span><span class="st">terminó</span><span class="cv">${CHEV}</span></div>
  ${open ? '<div class="res">Dos defectos reales en el corte del fork…</div>' : ''}
  <p class="p">El subagente terminó: encontró <b>dos defectos</b> en el corte del fork. Los corrijo ahora.</p>
  <div class="note"><span class="ic">${AGENT}</span><span class="nm">Pruebas de integración</span><span class="st">falló</span><span class="cv">${CHEV}</span></div>
  <p class="p">El segundo subagente falló al compilar; lo reintento con más tiempo.</p>`;
const sheet = (theme) => `
  <section class="sheet th-${theme}">
    <h1>Aviso de subagente terminado</h1>
    <p class="lede">Para despertar al agente cuando un subagente termina, Workass le envía un mensaje. Hoy ese mensaje se dibuja <b>como si lo hubieras escrito vos</b>. Propuesta: <b>una línea discreta</b> (como las notificaciones de tareas de Claude Code), con el resultado plegado; «falló» en gris, nunca en rojo. El agente lo sigue recibiendo igual.</p>
    <div class="cols">
      <div><div class="cap"><b>Hoy</b> — burbuja de usuario</div><div class="win">${today()}</div></div>
      <div><div class="cap"><b>Propuesta</b> — línea de sistema (primera abierta)</div><div class="win">${proposal(true)}</div></div>
    </div>
  </section>`;
const h = location.hash.replace('#', '');
if (h === 'dark') document.body.classList.add('only-dark');
if (h === 'light') { document.body.classList.add('only-light'); document.documentElement.style.background = document.body.style.background = '#eceae6'; }
document.getElementById('out').innerHTML = sheet('dark') + sheet('light');
</script>
</body>
</html>
