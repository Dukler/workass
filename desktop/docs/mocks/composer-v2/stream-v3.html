<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Frases — scroll de antes vs scroll continuo</title>
<style>
:root{
  --bg:#0f0e0d; --side:#151413; --panel:#1d1c1a; --ink:#f2efe9; --ink2:#cfcbc4; --muted:#9c978f; --faint:#908b82; --dim:#6f6a63;
  --acc:#4fa583; --amber:#d8a05a; --line:rgba(255,255,255,.075); --line2:rgba(255,255,255,.14);
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0; background:#0b0a09}
body{color:var(--ink); font:14px/1.6 -apple-system,BlinkMacSystemFont,system-ui,sans-serif; -webkit-font-smoothing:antialiased}
.wrap{max-width:1440px; margin:0 auto; padding:24px 20px 30px}
.top{display:flex; align-items:center; gap:14px; margin:0 0 18px}
.top h1{font-size:16px; font-weight:600; margin:0}
.top .sp{flex:1}
.btn{font:inherit; font-size:13px; color:var(--ink); background:rgba(255,255,255,.08); border:0; border-radius:9px; padding:7px 15px; cursor:pointer; display:inline-flex; align-items:center; gap:8px}
.btn.primary{background:var(--ink); color:#0f0e0d; font-weight:600}
.seg{display:inline-flex; background:rgba(255,255,255,.05); border-radius:9px; padding:3px}
.seg button{font:inherit; font-size:12.5px; color:var(--muted); background:none; border:0; border-radius:7px; padding:5px 11px; cursor:pointer}
.seg button.on{background:rgba(255,255,255,.1); color:var(--ink)}
.grid{display:grid; grid-template-columns:1fr 1fr; gap:20px}
@media (max-width:1100px){ .grid{grid-template-columns:1fr} .top{flex-wrap:wrap} .label span{display:block} }
.label{display:flex; align-items:baseline; gap:10px; margin:0 0 8px}
.label b{font-size:14px; font-weight:600}
.label span{font-size:12.5px; color:var(--dim)}

/* an app window */
.win{position:relative; height:640px; border-radius:14px; background:var(--bg); box-shadow:0 0 0 1px rgba(255,255,255,.09), 0 30px 70px -30px rgba(0,0,0,.9); overflow:hidden; display:flex; flex-direction:column}
.bar{height:42px; flex:none; display:flex; align-items:center; gap:10px; padding:0 16px; border-bottom:1px solid var(--line)}
.dots{display:flex; gap:7px} .dots i{width:11px; height:11px; border-radius:50%; background:#3a3835}
.bar .ttl{font-size:13px; font-weight:600; color:var(--ink2); margin-left:6px}
.bar .tag{font:11px var(--mono); color:var(--muted); padding:1px 6px; border-radius:5px; box-shadow:inset 0 0 0 1px var(--line2)}
.vp{position:relative; flex:1; min-height:0}
.scroll{position:absolute; inset:0; overflow-y:auto; scrollbar-width:none; overflow-anchor:none}
.scroll::-webkit-scrollbar{display:none}
.doc{max-width:600px; margin:0 auto; padding:22px 22px 110px}
.upill{margin:0 0 16px auto; width:fit-content; max-width:80%; background:#262422; border-radius:16px; padding:8px 14px; font-size:13.5px}
.worked{display:flex; align-items:center; gap:8px; color:var(--muted); font-size:12.5px; margin:0 0 10px}
.worked .m{color:var(--dim)}

/* live Working line, bottom of the transcript */
.live{position:absolute; left:0; right:0; bottom:0; padding:14px 0 12px; background:linear-gradient(to top, var(--bg) 60%, rgba(15,14,13,.9) 85%, transparent); pointer-events:none}
.live .in{max-width:600px; margin:0 auto; padding:0 22px; display:flex; align-items:center; gap:9px; font-size:13px; color:var(--ink2)}
.live .m{color:var(--dim); font-size:12px; font-variant-numeric:tabular-nums}
.orbit{position:relative; width:12px; height:12px; flex:none}
.orbit::before{content:""; position:absolute; inset:0; border-radius:50%; border:1.5px solid rgba(79,165,131,.28)}
.orbit::after{content:""; position:absolute; width:4px; height:4px; border-radius:50%; background:var(--acc); top:-1px; left:4px; transform-origin:2px 7px; animation:orb 1s linear infinite}
@keyframes orb{to{transform:rotate(360deg)}}
.dotsx::after{content:"..."; display:inline-block; width:1.2em; animation:dx 1.6s steps(1) infinite}
@keyframes dx{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
.live.done{display:none}

/* composer (today's box + the approved t3 row) */
.comp-wrap{flex:none; padding:0 18px 14px}
.comp-wrap .inner{max-width:600px; margin:0 auto}
.comp{position:relative; background:var(--panel); border:1px solid var(--line2); border-radius:15px; padding:11px 13px 9px; font-size:13.5px; color:var(--faint)}
.comp .send{position:absolute; right:9px; bottom:8px; width:26px; height:26px; border-radius:50%; background:#3a3835; display:grid; place-items:center; color:var(--ink)}
.comp .send i{width:9px; height:9px; border-radius:2px; background:var(--ink)}
.row{display:flex; align-items:center; gap:6px; margin-top:7px; font-size:12.5px; color:var(--muted)}
.row .amber{color:var(--amber)} .row .sp{flex:1} .row .vr{width:1px; height:14px; background:var(--line2)}
.row .mk{color:#cc7a52}

/* markdown, the app's reading styles */
.md{font-size:14px; line-height:1.65; color:var(--ink)}
.md h2{font-size:16px; font-weight:600; margin:0 0 10px; letter-spacing:-.005em}
.md p{margin:0 0 12px}
.md ul{margin:0 0 12px; padding-left:18px}
.md li{margin:0 0 4px}
.md li::marker{color:var(--dim)}
.md pre{margin:0 0 12px; padding:11px 13px; border-radius:10px; background:#181716; box-shadow:0 0 0 1px var(--line); font:12px/1.6 var(--mono); color:var(--ink2); white-space:pre-wrap}
.md pre span{display:block}
.md pre .kw{color:#c9a3e6} .md pre .fn{color:#8fb0ea} .md pre .nb{color:#e0b07a}
.md code{font:12px var(--mono); background:rgba(255,255,255,.06); border-radius:4px; padding:1px 5px}
.md table{border-collapse:collapse; margin:0 0 12px; font-size:13px}
.md td,.md th{padding:5px 12px; border-bottom:1px solid var(--line)}
.md th{font-weight:600; text-align:left; color:var(--ink2); border-bottom-color:var(--line2)}
.md b{font-weight:650}

/* THE animation. Opacity only — composited, no layout, no paint of neighbours.
   One shot per new node; nothing already on screen ever animates again. */
@keyframes fi{from{opacity:0}}
.fb{animation:fi 600ms ease-out both}     /* t3code: whole block */
.fs{animation:fi 280ms ease-out both}     /* frases: one sentence / item / line / row */
@media (prefers-reduced-motion: reduce){ .fb,.fs{animation:none} }

.stats{display:flex; gap:18px; margin-top:10px; font:12px var(--mono); color:var(--dim)}
.stats b{font-weight:500; color:var(--ink2)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>Frases — el mismo texto, dos maneras de seguirlo</h1>
    <span class="sp"></span>
    <div class="seg" id="speeds"><button data-ms="30">normal</button><button data-ms="12" class="on">rápido</button><button data-ms="4">muy rápido</button></div>
    <button class="btn primary" id="play">▶ Reproducir</button>
  </div>
  <div class="grid">
    <div>
      <div class="label"><b>Antes</b><span>a new smooth scroll for every finished sentence: each one speeds up and slows down, so several per second bob</span></div>
      <div class="win" id="w0"></div>
      <div class="stats" id="s0"></div>
    </div>
    <div>
      <div class="label"><b>Ahora · continuo</b><span>one glide that eases toward the end at a steady pace, however often sentences land; one number written per frame</span></div>
      <div class="win" id="w1"></div>
      <div class="stats" id="s1"></div>
    </div>
  </div>
</div>

<script>
const ANSWER = [
  '## Gold vs Silver on frame 3812\n\n',
  'The two labels agree everywhere except the floor seam between the legs. Gold kept the original production fill, while Silver cleared it, which matches the spec for this frame type. I checked it against the raw production pass before deciding anything.\n\n',
  'What I checked:\n\n',
  '- the raw floor pixels from the original production pass\n',
  '- the Silver mask after the correction\n',
  '- the Gold mask, untouched since import\n\n',
  'The difference is confined to one region, and it is small:\n\n',
  '```python\n',
  'diff = np.logical_xor(gold_mask, silver_mask)\n',
  'ys, xs = np.nonzero(diff)\n',
  'print(diff.sum(), ys.min(), ys.max(), xs.min(), xs.max())\n',
  '```\n\n',
  '| Frame | Gold | Silver | Differs |\n',
  '|---|---|---|---|\n',
  '| 3812 | filled | cleared | yes |\n',
  '| 3815 | cleared | cleared | no |\n',
  '| 3821 | cleared | cleared | no |\n\n',
  'So the only frame to fix is **3812**, and the fix is on the Gold side: clear the seam the same way Silver did. Everything else already matches, so the review can close once that frame is re-exported. I will re-run the diff afterwards to confirm it comes back empty, and then write the summary to `labels/review/3812.md`.',
].join('');

const esc = (s) => s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
const inline = (s) => esc(s).replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>');
const hl = (s) => esc(s).replace(/\b(print)\b/g,'<i class="kw">$1</i>').replace(/\b(np)\.(\w+)/g,'$1.<i class="fn">$2</i>').replace(/\.(sum|min|max)\(/g,'.<i class="nb">$1</i>(').replace(/<i /g,'<span style="display:inline" ').replace(/<\/i>/g,'</span>');
const SEP = /^\|[-| :]+\|\s*$/;

function parse(text){
  const lines = text.split('\n'); const blocks = []; let i = 0;
  while (i < lines.length){
    const l = lines[i];
    if (l.startsWith('```')){ const parts=[]; i++; while (i<lines.length && !lines[i].startsWith('```')){ parts.push(lines[i]); i++; } if (i<lines.length) i++; while (parts.length && parts[parts.length-1]==='' ) parts.pop(); blocks.push({type:'code', parts}); continue; }
    if (/^#{1,6} /.test(l)){ blocks.push({type:'h', parts:[l.replace(/^#+ /,'')]}); i++; continue; }
    if (/^- /.test(l)){ const parts=[]; while (i<lines.length && /^- /.test(lines[i])){ parts.push(lines[i].slice(2)); i++; } blocks.push({type:'ul', parts}); continue; }
    if (l.startsWith('|') && i+1<lines.length && SEP.test(lines[i+1])){ const parts=[l]; i+=2; while (i<lines.length && lines[i].startsWith('|')){ parts.push(lines[i]); i++; } blocks.push({type:'table', parts}); continue; }
    if (l.trim()===''){ i++; continue; }
    const buf=[]; while (i<lines.length && lines[i].trim()!=='' && !lines[i].startsWith('```') && !/^#{1,6} /.test(lines[i]) && !/^- /.test(lines[i]) && !lines[i].startsWith('|')){ buf.push(lines[i]); i++; }
    if (!buf.length){ i++; continue; }
    const para = buf.join(' ');
    blocks.push({type:'p', parts: para.match(/[\s\S]*?[.!?:](?=\s|$)\s*|[\s\S]+$/g)?.filter(s=>s.trim()) || [para]});
  }
  return blocks;
}
const cells = (row) => row.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
function partHTML(type, part, idx){
  if (type==='code') return `<span>${hl(part)||' '}</span>`;
  if (type==='ul') return `<li>${inline(part)}</li>`;
  if (type==='table') return `<tr>${cells(part).map(c=> idx===0?`<th>${inline(c)}</th>`:`<td>${inline(c)}</td>`).join('')}</tr>`;
  return `<span>${inline(part)}</span>`;
}
function blockHTML(b, cls){
  const ps = b.parts.map((p,k)=>partHTML(b.type,p,k)).join('');
  return {h:`<h2 class="${cls}">${ps}</h2>`, p:`<p class="${cls}">${ps}</p>`, ul:`<ul class="${cls}">${ps}</ul>`, code:`<pre class="${cls}">${ps}</pre>`, table:`<table class="${cls}"><tbody>${ps}</tbody></table>`}[b.type];
}
// t3code's splitter (assistantStreaming.ts): blank line outside a fence, closing fence, list-item start.
function blockCut(t){ let inFence=false, cut=0, pos=0; const L=t.split('\n');
  for (let k=0;k<L.length-1;k++){ const l=L[k]; const end=pos+l.length+1;
    if (l.startsWith('```')){ inFence=!inFence; if(!inFence) cut=end; }
    else if (!inFence && l.trim()==='') cut=end;
    else if (!inFence && /^- /.test(L[k+1]||'')) cut=end;
    pos=end; }
  return cut; }
// Ours: + every finished sentence, list item, code line, and table row once the table exists.
function sentenceCut(t){ let cut=blockCut(t), inFence=false, pos=0; const L=t.split('\n');
  for (let k=0;k<L.length;k++){ const l=L[k]; const complete=k<L.length-1; const end=pos+l.length+1;
    if (l.startsWith('```')){ inFence=!inFence; if (complete) cut=Math.max(cut,end); }
    else if (complete && (inFence || /^- /.test(l))) cut=Math.max(cut,end);
    else if (complete && l.startsWith('|')){ if (!SEP.test(l) && L.slice(0,k).some(x=>SEP.test(x))) cut=Math.max(cut,end); }
    else if (!inFence && !l.startsWith('|') && !/^#/.test(l)){ const re=/[.!?:](?=\s)/g; let m; while((m=re.exec(l))) cut=Math.max(cut,pos+m.index+2); }
    else if (complete && /^#{1,6} /.test(l)) cut=Math.max(cut,end);
    pos=end; }
  return Math.min(cut,t.length); }

// Continuous follow: a critically damped spring toward the end. Its speed
// ramps up and down smoothly, and a sentence landing mid-glide just extends the
// motion instead of starting a new one. One scrollTop write per frame while it
// moves; it stops by itself.
function makeFollower(sc){
  let raf = 0, last = 0, x = 0, v = 0;
  const W = 7.5; // spring stiffness (rad/s): settles in ~0.5 s
  const step = (now) => {
    const dt = last ? Math.min(0.05, (now - last) / 1000) : 1 / 60; last = now;
    if (Math.abs(sc.scrollTop - x) > 2) { x = sc.scrollTop; v = 0; }   // someone else moved it
    const target = sc.scrollHeight - sc.clientHeight;
    const a = W * W * (target - x) - 2 * W * v;
    v += a * dt; x += v * dt;
    if (x > target) { x = target; v = 0; }
    sc.scrollTop = x;
    if (target - x < 0.5 && Math.abs(v) < 4) { sc.scrollTop = x = target; v = 0; raf = 0; last = 0; return; }
    raf = requestAnimationFrame(step);
  };
  return { kick(){ if (!raf) { x = sc.scrollTop; raf = requestAnimationFrame(step); } }, reset(){ cancelAnimationFrame(raf); raf = 0; last = 0; x = 0; v = 0; } };
}

function makeWin(el, stEl, mode, follow){
  el.innerHTML = `<div class="bar"><span class="dots"><i></i><i></i><i></i></span><span class="ttl">Gold vs Silver review</span><span class="tag">lagspace</span></div>
    <div class="vp"><div class="scroll"><div class="doc"><div class="upill">compare gold and silver on the frames we touched</div><div class="worked"><span>Worked</span><span class="m">41s · 6 tools</span></div><div class="md"></div></div></div>
    <div class="live"><div class="in"><span class="orbit"></span><span>Working<span class="dotsx"></span></span><span class="m t">0s · 6 tools</span></div></div></div>
    <div class="comp-wrap"><div class="inner"><div class="comp">Contale a tu agente qué sigue…<span class="send"><i></i></span></div>
    <div class="row"><span class="amber">🔒︎ Permitir todo ⌄</span><span class="sp"></span><span class="mk">✳︎</span><span>Opus 5.5 ⌄</span><span class="vr"></span><span>XHigh · Fast ⌄</span></div></div></div>`;
  const sc = el.querySelector('.scroll'), md = el.querySelector('.md'), doc = el.querySelector('.doc'), live = el.querySelector('.live'), tl = el.querySelector('.t');
  const cls = mode==='blocks' ? 'fb' : 'fs';
  let shown = [], paints = 0, jsMs = 0, nodes = 0, t0 = 0;
  const follower = follow === 'continuous' ? makeFollower(sc) : null;
  new ResizeObserver(() => follower ? follower.kick() : sc.scrollTo({ top: sc.scrollHeight, behavior: 'smooth' })).observe(doc);
  const stats = () => { stEl.innerHTML = `redibujos <b>${paints}</b> · JS por redibujo <b>${paints ? (jsMs/paints).toFixed(2) : '0.00'} ms</b> · nodos animados <b>${nodes}</b> · anima <b>solo opacity</b>`; };
  return {
    reset(){ follower?.reset(); md.innerHTML=''; shown=[]; paints=0; jsMs=0; nodes=0; sc.scrollTo({top:0}); live.classList.remove('done'); t0=performance.now(); stats(); },
    tick(){ tl.textContent = `${Math.floor((performance.now()-t0)/1000)}s · 6 tools`; },
    update(full, done){
      const a = performance.now();
      const vis = done ? full : full.slice(0, mode==='blocks' ? blockCut(full) : sentenceCut(full));
      let changed = false;
      parse(vis).forEach((b,k)=>{
        const prev = shown[k];
        if (!prev){ md.insertAdjacentHTML('beforeend', blockHTML(b, cls)); shown[k]={n:b.parts.length, el:md.lastElementChild}; changed=true; nodes++; return; }
        if (b.parts.length > prev.n){
          const host = b.type==='table' ? prev.el.querySelector('tbody') : prev.el;
          for (let j=prev.n;j<b.parts.length;j++){ host.insertAdjacentHTML('beforeend', partHTML(b.type,b.parts[j],j)); host.lastElementChild.classList.add(cls); nodes++; }
          prev.n = b.parts.length; changed = true;
        }
      });
      if (changed){ paints++; jsMs += performance.now()-a; stats(); }
      if (done) live.classList.add('done');
    },
  };
}

const wins = [makeWin(document.getElementById('w0'), document.getElementById('s0'), 'sentences', 'native'), makeWin(document.getElementById('w1'), document.getElementById('s1'), 'sentences', 'continuous')];
let speed = 12, runId = 0;
async function run(){
  const id = ++runId; wins.forEach(w=>w.reset());
  let at = 0, seed = 7;
  await new Promise(r=>setTimeout(r,500));
  while (at < ANSWER.length && id===runId){
    seed = (seed*9301+49297)%233280; at += 1 + (seed%6);
    const t = ANSWER.slice(0, at); wins.forEach(w=>{ w.update(t,false); w.tick(); });
    await new Promise(r=>setTimeout(r,speed));
  }
  if (id===runId) wins.forEach(w=>w.update(ANSWER,true));
}
document.getElementById('play').onclick = run;
for (const b of document.querySelectorAll('#speeds button')) b.onclick = () => { document.querySelectorAll('#speeds button').forEach(x=>x.classList.remove('on')); b.classList.add('on'); speed=+b.dataset.ms; run(); };
run();
</script>
</body>
</html>
