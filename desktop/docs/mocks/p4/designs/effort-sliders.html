<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>workass — effort slider gallery</title>
<style>
  /* ===== tokens copied verbatim from workass-one.html ===== */
  :root { color-scheme: dark;
    --bg:#151413; --side:#0f0e0d; --panel:#1d1c1a; --card:#1a1918; --field:#252320;
    --ink:#f2efe9; --ink2:#cfcbc4; --muted:#9c978f; --faint:#6f6b63;
    --line:rgba(255,255,255,.075); --line2:rgba(255,255,255,.14);
    --acc:#4fa583; --link:#8fb0ea; --amber:#d8a05a; --add:#4cae7f; --del:#d96b5f;
    --shell:#100f0e; /* recessed groove tone (added for variant B, darker than --panel) */
  }
  [data-theme="light"] { color-scheme: light;
    --bg:#faf9f7; --side:#f2f0ed; --panel:#ffffff; --card:#ffffff; --field:#f1efeb;
    --ink:#23211e; --ink2:#47443e; --muted:#7a756d; --faint:#a19c93;
    --line:rgba(0,0,0,.08); --line2:rgba(0,0,0,.15);
    --acc:#177353; --link:#3861b0; --amber:#9a6a1d; --add:#177347; --del:#bd4436;
    --shell:#eae7e2;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; }
  body { background:var(--bg); color:var(--ink); font:13.5px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
         padding:0 0 60px; overflow-y:auto; }
  .mono { font-family:ui-monospace,"SF Mono",Menlo,monospace; }

  /* ===== page chrome ===== */
  .top { position:sticky; top:0; z-index:50; display:flex; align-items:center; gap:14px;
         padding:14px 30px; background:color-mix(in srgb, var(--bg) 88%, transparent);
         backdrop-filter:blur(8px); border-bottom:1px solid var(--line); }
  .top h1 { font-size:15px; font-weight:600; }
  .top .sub { color:var(--muted); font-size:12px; }
  .top .sp { flex:1; }
  .tgl { display:inline-flex; align-items:center; gap:7px; height:28px; padding:0 12px;
         border:1px solid var(--line2); border-radius:8px; background:transparent; color:var(--ink2);
         font:inherit; font-size:12px; cursor:pointer; transition:background .15s ease,color .15s ease; }
  .tgl:hover { background:var(--line); color:var(--ink); }
  .tgl svg { width:14px; height:14px; }

  .wrap { max-width:940px; margin:0 auto; padding:8px 24px; }
  section.variant { margin-top:14px; }
  .vhead { display:flex; align-items:baseline; gap:10px; padding:0 4px; }
  .vhead .tag { display:inline-grid; place-items:center; width:22px; height:22px; border-radius:6px;
                background:var(--field); border:1px solid var(--line2); color:var(--ink); font-weight:600; font-size:12px; }
  .vhead .name { font-size:14px; font-weight:600; }
  .vcap { padding:4px 4px 0; color:var(--muted); font-size:12.5px; max-width:760px; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:8px; }
  @media (max-width:760px){ .grid2 { grid-template-columns:1fr; } }

  /* demo card — headroom above so the upward popover is never clipped */
  .demo { position:relative; border:1px solid var(--line); border-radius:12px; background:var(--card);
          padding:150px 18px 18px; overflow:visible; }
  .demo .stopsig { position:absolute; top:12px; left:14px; color:var(--faint); font-size:11px;
                   letter-spacing:.04em; text-transform:uppercase; }

  /* faux composer (context strip, the bottom of the real composer) */
  .comp { background:var(--panel); border:1px solid var(--line2); border-radius:15px; padding:11px 13px 9px; }
  .comp .ph { color:var(--faint); font-size:13.5px; }
  .comprow { display:flex; align-items:center; gap:10px; margin-top:10px; }
  .comprow .sp { flex:1; }
  .modelsel { color:var(--ink2); font-size:12.5px; } .modelsel .eff { color:var(--muted); }
  .effortsel { color:var(--ink2); font-size:12.5px; cursor:pointer; display:inline-flex; align-items:center; gap:5px; position:relative; }
  .effortsel .eff { color:var(--muted); }
  .effortsel .egauge { display:inline-flex; color:var(--muted); } .effortsel .egauge svg { width:13px; height:13px; }
  .send { width:26px; height:26px; border-radius:50%; background:var(--ink); color:var(--bg); border:0;
          display:grid; place-items:center; cursor:pointer; font-size:13px; }

  /* popover shell — the .acctpop family: panel, hairline, 11px radius, subtle shadow */
  .pop { position:absolute; bottom:calc(100% + 8px); right:0; z-index:20; background:var(--panel);
         border:1px solid var(--line2); border-radius:11px; padding:9px 10px 11px;
         box-shadow:0 10px 34px rgba(0,0,0,.4); }
  [data-theme="light"] .pop { box-shadow:0 10px 30px rgba(0,0,0,.14); }
  .pcaprow { display:flex; align-items:baseline; gap:10px; padding:1px 3px 8px; }
  .pcap { font-size:10.5px; font-weight:600; letter-spacing:.09em; color:var(--faint); text-transform:uppercase; }
  .pcap .sp { flex:1; }

  /* ===== shared slider skeleton ===== */
  .sl { position:relative; touch-action:none; outline:none; user-select:none; -webkit-user-select:none; }
  .sl-track { position:relative; }
  .sl-thumb { position:absolute; left:0; cursor:grab; transition:left .16s cubic-bezier(.4,0,.2,1); }
  .sl.dragging .sl-thumb { cursor:grabbing; transition:none; }

  /* ---- Variant A: macOS-style thin track ---- */
  .sl-A { padding:34px 9px 8px; }
  .sl-A .sl-track { height:3px; border-radius:3px; background:var(--line2); }
  .sl-A .dot { position:absolute; top:50%; width:3px; height:3px; border-radius:50%;
               background:var(--line2); transform:translate(-50%,-50%); }
  .sl-A .sl-thumb { top:50%; width:14px; height:14px; margin-top:-7px; border-radius:50%;
                    background:var(--field); border:1px solid var(--line2);
                    box-shadow:0 1px 2.5px rgba(0,0,0,.35), 0 0 0 0 color-mix(in srgb,var(--acc) 55%,transparent);
                    transition:left .16s cubic-bezier(.4,0,.2,1), box-shadow .15s ease; }
  [data-theme="light"] .sl-A .sl-thumb { box-shadow:0 1px 2px rgba(0,0,0,.18), 0 0 0 0 color-mix(in srgb,var(--acc) 55%,transparent); }
  .sl-A.dragging .sl-thumb, .sl-A:focus .sl-thumb {
     box-shadow:0 1px 3px rgba(0,0,0,.4), 0 0 0 2px color-mix(in srgb,var(--acc) 62%,transparent); }
  .sl-A .sl-lab { position:absolute; bottom:calc(100% + 12px); transform:translateX(-50%);
                  color:var(--ink2); font-size:11px; font-weight:550; white-space:nowrap;
                  transition:left .16s cubic-bezier(.4,0,.2,1); }
  .sl-A.dragging .sl-lab { transition:none; }

  /* ---- Variant B: inset groove + pill thumb ---- */
  .sl-B { padding:9px 8px 6px; }
  .sl-B .sl-track { height:28px; border-radius:9px; background:var(--shell);
                    border:1px solid var(--line); box-shadow:inset 0 1px 2px rgba(0,0,0,.4); }
  [data-theme="light"] .sl-B .sl-track { box-shadow:inset 0 1px 2px rgba(0,0,0,.09); }
  .sl-B .sl-thumb { top:3px; height:22px; display:grid; place-items:center; padding:0 10px;
                    border-radius:7px; background:var(--field); border:1px solid var(--line2);
                    box-shadow:inset 0 -2px 0 color-mix(in srgb,var(--acc) 70%,transparent), 0 1px 2px rgba(0,0,0,.3);
                    color:var(--ink); font-size:11.5px; font-weight:550; white-space:nowrap; }
  [data-theme="light"] .sl-B .sl-thumb { box-shadow:inset 0 -2px 0 color-mix(in srgb,var(--acc) 70%,transparent), 0 1px 2px rgba(0,0,0,.12); }
  .sl-B .sl-stops { position:relative; height:15px; margin-top:8px; }
  .sl-B .st { position:absolute; transform:translateX(-50%); color:var(--muted); font-size:10px; white-space:nowrap; transition:color .15s ease; }
  .sl-B .st.on { color:var(--ink); font-weight:550; }

  /* ---- Variant C: filled-to-thumb minimal ---- */
  .sl-C { padding:16px 9px 6px; }
  .sl-C .sl-track { height:2px; border-radius:2px; background:var(--line2); }
  .sl-C .sl-fill { position:absolute; left:0; top:0; height:2px; border-radius:2px;
                   background:color-mix(in srgb, var(--acc) 38%, var(--line2));
                   transition:width .16s cubic-bezier(.4,0,.2,1); }
  .sl-C.dragging .sl-fill { transition:none; }
  .sl-C .sl-thumb { top:50%; width:13px; height:13px; margin-top:-6.5px; border-radius:50%;
                    background:var(--field); border:1px solid var(--line2); box-shadow:0 1px 2px rgba(0,0,0,.32); }
  [data-theme="light"] .sl-C .sl-thumb { box-shadow:0 1px 2px rgba(0,0,0,.16); }
  .sl-C.dragging .sl-thumb, .sl-C:focus .sl-thumb { border-color:color-mix(in srgb,var(--acc) 55%,var(--line2)); }
  .sl-C .sl-stops { position:relative; height:15px; margin-top:11px; }
  .sl-C .st { position:absolute; transform:translateX(-50%); color:var(--muted); font-size:10px; white-space:nowrap; transition:color .15s ease; }
  .sl-C .st.on { color:var(--ink); font-weight:550; }

  /* ---- Variant D: fader rail (original) — vertical grip echoing the .rzh resize grips + mono readout ---- */
  .sl-D { padding:16px 8px 4px; }
  .sl-D .sl-track { height:2px; border-radius:2px; background:var(--line); }
  .sl-D .sl-fill { position:absolute; left:0; top:0; height:2px; border-radius:2px; background:var(--line2);
                   transition:width .16s cubic-bezier(.4,0,.2,1); }
  .sl-D.dragging .sl-fill { transition:none; }
  .sl-D .tick { position:absolute; top:50%; width:1px; height:8px; background:var(--line2);
                transform:translate(-50%,-50%); }
  .sl-D .tick.past { background:var(--muted); }
  .sl-D .sl-thumb { top:50%; width:6px; height:20px; margin-top:-10px; border-radius:3px;
                    background:var(--field); border:1px solid var(--line2);
                    box-shadow:0 1px 2.5px rgba(0,0,0,.4); display:grid; place-items:center; }
  [data-theme="light"] .sl-D .sl-thumb { box-shadow:0 1px 2px rgba(0,0,0,.18); }
  .sl-D .grip { width:2px; height:11px; border-radius:1px; background:transparent; transition:background .15s ease; }
  .sl-D.dragging .sl-thumb, .sl-D:focus .sl-thumb { border-color:color-mix(in srgb,var(--acc) 60%,var(--line2)); }
  .sl-D.dragging .grip, .sl-D:focus .grip { background:color-mix(in srgb,var(--acc) 78%,transparent); }
  .sl-D .sl-readout { color:var(--muted); font-size:11px; font-family:ui-monospace,Menlo,monospace; }

  .foot { max-width:940px; margin:26px auto 0; padding:16px 28px 0; border-top:1px solid var(--line);
          color:var(--muted); font-size:12.5px; }
  .foot b { color:var(--ink); font-weight:600; }
</style>
</head>
<body>
  <div class="top">
    <h1>Effort slider — 4 real-slider designs</h1>
    <span class="sub">draggable thumb · click track · snaps to stops · arrows</span>
    <span class="sp"></span>
    <button class="tgl" id="themeBtn">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><circle cx="8" cy="8" r="3.2"/><path d="M8 1.4v1.6M8 13v1.6M1.4 8h1.6M13 8h1.6M3.3 3.3l1.1 1.1M11.6 11.6l1.1 1.1M12.7 3.3l-1.1 1.1M4.4 11.6l-1.1 1.1"/></svg>
      <span id="themeTxt">Tema</span>
    </button>
  </div>

  <div class="wrap" id="gallery"></div>

  <div class="foot">Elegí una: <b>A · B · C · D</b></div>

<script>
(function(){
  const SIX = ['low','medium','high','xhigh','max','ultra'];
  const TWO = ['low','high'];
  const VARIANTS = [
    { id:'A', name:'macOS-style', cap:'Thin 3px rail with tick dots, a small round field thumb, and a floating stop label above it. Green appears only as a 2px accent ring on the thumb while dragging or focused.' },
    { id:'B', name:'Notch / inset', cap:'Recessed groove with a rounded pill thumb that carries the current label inside it; stop names sit muted underneath, the active one inked. Mirrors the sidebar .modes thumb.' },
    { id:'C', name:'Filled-to-thumb minimal', cap:'The most conventional read: 2px rail, the portion left of the thumb tinted with a muted accent (~38% mix), round thumb, labels below with the active one inked. Restrained by design.' },
    { id:'D', name:'Fader rail', cap:'A vertical grip handle echoing the app’s .rzh resize grips (green hairline on drag), a ruler of ticks that ink as you pass them, and a monospace value readout — no colored bar at all.' },
  ];

  const clamp = (v,a,b)=> v<a?a : v>b?b : v;

  // ---------- build one slider (returns {root, refs, api}) ----------
  function buildSlider(variant, stops, value){
    const n = stops.length;
    const root = document.createElement('div');
    root.className = 'sl sl-'+variant;
    root.tabIndex = 0;
    root.setAttribute('role','slider');
    root.setAttribute('aria-valuemin','0');
    root.setAttribute('aria-valuemax', String(n-1));

    const track = document.createElement('div'); track.className='sl-track';
    const thumb = document.createElement('div'); thumb.className='sl-thumb';

    let dots=[], ticks=[], stopEls=[], fill=null, lab=null, readout=null, trigger=null;

    if (variant==='A'){
      lab = document.createElement('div'); lab.className='sl-lab';
      stops.forEach(()=>{ const d=document.createElement('div'); d.className='dot'; track.appendChild(d); dots.push(d); });
      track.appendChild(lab);
      track.appendChild(thumb);
      root.appendChild(track);
    } else if (variant==='B'){
      track.appendChild(thumb);
      root.appendChild(track);
      const srow=document.createElement('div'); srow.className='sl-stops';
      stops.forEach(s=>{ const e=document.createElement('div'); e.className='st'; e.textContent=s; srow.appendChild(e); stopEls.push(e); });
      root.appendChild(srow);
    } else if (variant==='C'){
      fill=document.createElement('div'); fill.className='sl-fill';
      track.appendChild(fill); track.appendChild(thumb);
      root.appendChild(track);
      const srow=document.createElement('div'); srow.className='sl-stops';
      stops.forEach(s=>{ const e=document.createElement('div'); e.className='st'; e.textContent=s; srow.appendChild(e); stopEls.push(e); });
      root.appendChild(srow);
    } else { // D
      fill=document.createElement('div'); fill.className='sl-fill';
      track.appendChild(fill);
      stops.forEach(()=>{ const t=document.createElement('div'); t.className='tick'; track.appendChild(t); ticks.push(t); });
      const grip=document.createElement('div'); grip.className='grip'; thumb.appendChild(grip);
      track.appendChild(thumb);
      root.appendChild(track);
    }

    const inst = { root, track, thumb, stops, n, value, dots, ticks, stopEls, fill, lab,
                   variant, trigger:null };

    function layout(){
      const tw = track.clientWidth;
      const half = thumb.offsetWidth/2;
      const travel = tw - thumb.offsetWidth;
      inst._travel = travel; inst._half = half;
      const center = i => half + (n<2?0:(i/(n-1))*travel);
      dots.forEach((d,i)=> d.style.left = center(i)+'px');
      ticks.forEach((t,i)=> t.style.left = center(i)+'px');
      stopEls.forEach((e,i)=> e.style.left = center(i)+'px');
    }
    function paint(){
      const travel = inst._travel, half = inst._half;
      const pct = n<2?0 : inst.value/(n-1);
      const x = pct*travel;
      thumb.style.left = x+'px';
      const center = x + half;
      if (fill) fill.style.width = center+'px';
      if (lab){ lab.textContent = stops[inst.value]; lab.style.left = center+'px'; }
      if (variant==='B') thumb.textContent = stops[inst.value];
      stopEls.forEach((e,i)=> e.classList.toggle('on', i===inst.value));
      ticks.forEach((t,i)=> t.classList.toggle('past', i<=inst.value));
      root.setAttribute('aria-valuenow', String(inst.value));
      root.setAttribute('aria-valuetext', stops[inst.value]);
      if (inst.trigger) inst.trigger.textContent = stops[inst.value];
    }
    inst.layout = ()=>{ layout(); paint(); };
    inst.paint = paint;

    function setVal(v){ v=clamp(v,0,n-1); if(v!==inst.value){ inst.value=v; paint(); } else paint(); }
    function valueFromX(clientX){
      const r = track.getBoundingClientRect();
      const half = thumb.offsetWidth/2;
      const denom = r.width - thumb.offsetWidth;
      let pct = denom<=0 ? 0 : (clientX - r.left - half)/denom;
      pct = clamp(pct,0,1);
      return Math.round(pct*(n-1));
    }

    function onDown(e){
      e.preventDefault();
      root.classList.add('dragging'); root.focus();
      try{ root.setPointerCapture(e.pointerId); }catch(_){}
      setVal(valueFromX(e.clientX));
    }
    function onMove(e){ if(!root.classList.contains('dragging')) return; setVal(valueFromX(e.clientX)); }
    function onUp(e){ root.classList.remove('dragging'); try{ root.releasePointerCapture(e.pointerId); }catch(_){} }
    root.addEventListener('pointerdown', onDown);
    root.addEventListener('pointermove', onMove);
    root.addEventListener('pointerup', onUp);
    root.addEventListener('pointercancel', onUp);
    root.addEventListener('keydown', (e)=>{
      let v=inst.value;
      if(e.key==='ArrowRight'||e.key==='ArrowUp') v++;
      else if(e.key==='ArrowLeft'||e.key==='ArrowDown') v--;
      else if(e.key==='Home') v=0;
      else if(e.key==='End') v=n-1;
      else return;
      e.preventDefault(); setVal(v);
    });

    return inst;
  }

  // ---------- build one demo card (composer strip + open popover + slider) ----------
  const GAUGE = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor"><path d="M2.8 11.2a5.2 5.2 0 0 1 10.4 0"/><path d="M8 11.2l2.6-2.4"/></svg>';

  function buildDemo(variant, stops, value, width){
    const demo = document.createElement('div'); demo.className='demo';
    const sig = document.createElement('div'); sig.className='stopsig';
    sig.textContent = stops.length+' stops';
    demo.appendChild(sig);

    const comp = document.createElement('div'); comp.className='comp';
    comp.innerHTML =
      '<div class="ph">Contale a tu agente qué sigue…</div>'+
      '<div class="comprow">'+
        '<span class="sp"></span>'+
        '<span class="modelsel">GPT-5.6-Sol <span class="eff">▾</span></span>'+
        '<span class="effortsel">'+
          '<span class="egauge">'+GAUGE+'</span>'+
          '<span class="etxt">high</span> <span class="eff">▾</span>'+
        '</span>'+
        '<button class="send">↑</button>'+
      '</div>';
    const effortsel = comp.querySelector('.effortsel');
    const etxt = comp.querySelector('.etxt');

    // popover
    const pop = document.createElement('div'); pop.className='pop';
    pop.style.width = (width+22)+'px';
    const caprow = document.createElement('div'); caprow.className='pcaprow pcaprow-'+variant;
    caprow.style.cssText='display:flex;align-items:baseline;gap:10px;padding:1px 3px 8px;';
    const cap = document.createElement('span'); cap.className='pcap'; cap.textContent='Esfuerzo';
    caprow.appendChild(cap);
    pop.appendChild(caprow);

    const slider = buildSlider(variant, stops, value);
    slider.root.style.width = width+'px';
    slider.trigger = etxt;
    if (variant==='D'){
      const spx=document.createElement('span'); spx.style.flex='1'; caprow.appendChild(spx);
      const ro=document.createElement('span'); ro.className='sl-readout'; ro.textContent=stops[value];
      caprow.appendChild(ro);
      // keep readout in sync by wrapping paint
      const origTrigger = etxt;
      slider.trigger = { set textContent(v){ origTrigger.textContent=v; ro.textContent=v; } };
    }
    pop.appendChild(slider.root);
    effortsel.appendChild(pop);

    demo.appendChild(comp);
    return { demo, slider };
  }

  // ---------- assemble gallery ----------
  const gallery = document.getElementById('gallery');
  const insts = [];
  VARIANTS.forEach(v=>{
    const sec = document.createElement('section'); sec.className='variant';
    const head = document.createElement('div'); head.className='vhead';
    head.innerHTML = '<span class="tag">'+v.id+'</span><span class="name">'+v.name+'</span>';
    sec.appendChild(head);
    const cap = document.createElement('div'); cap.className='vcap'; cap.textContent=v.cap;
    sec.appendChild(cap);
    const grid = document.createElement('div'); grid.className='grid2';
    const six = buildDemo(v.id, SIX, 2, 300);   // 6 stops, thumb on "high"
    const two = buildDemo(v.id, TWO, 1, 200);   // 2 stops, thumb on "high"
    grid.appendChild(six.demo); grid.appendChild(two.demo);
    sec.appendChild(grid);
    gallery.appendChild(sec);
    insts.push(six.slider, two.slider);
  });

  // layout after fonts/measure settle
  function relayoutAll(){ insts.forEach(s=> s.layout()); }
  requestAnimationFrame(()=>{ requestAnimationFrame(relayoutAll); });
  window.addEventListener('resize', relayoutAll);

  // theme toggle
  if (matchMedia('(prefers-color-scheme: light)').matches) document.documentElement.dataset.theme='light';
  if (location.hash==='#light') document.documentElement.dataset.theme='light';
  if (location.hash==='#dark') document.documentElement.dataset.theme='dark';
  const themeBtn = document.getElementById('themeBtn');
  const themeTxt = document.getElementById('themeTxt');
  function syncTheme(){ themeTxt.textContent = document.documentElement.dataset.theme==='light' ? 'Oscuro' : 'Claro'; }
  syncTheme();
  themeBtn.onclick = ()=>{
    document.documentElement.dataset.theme = document.documentElement.dataset.theme==='light' ? 'dark' : 'light';
    syncTheme(); relayoutAll();
  };

  // expose for scripted verification
  window.__sliders = insts;
})();
</script>
</body>
</html>
